workflow:
  id: new-workflow2
  description: A new workflow
  input:
    artifact: incoming-request.md
  steps:
    - id: step-1
      type: team
      team: research-team
      stage_type: chain
      input_artifact: incoming-brief.md
      result_artifact: research/plan-ready.md
      requested_result_type: 'artifact:research/plan-ready.md'
    - id: step-2
      type: human-in-the-loop
      prompt: Review the previous result and provide guidance for the next step.
      input_artifact: review/step-1.md
      result_artifact: feedback/step-2.json
      handoff:
        from_step: step-1
        from_artifact: research/plan-ready.md
        to_artifact: review/step-1.md
    - id: step-3
      type: team
      team: venture-capital-team
      stage_type: discussion
      input_artifact: incoming-brief.md
      result_artifact: output/minutes.md
      requested_result_type: 'artifact:output/minutes.md'
      handoff:
        from_step: step-2
        from_artifact: feedback/step-2.json
        to_artifact: incoming-brief.md
  output:
    from_step: step-3
    artifact: output/minutes.md
  on_blocked: stop
  on_failed: stop
