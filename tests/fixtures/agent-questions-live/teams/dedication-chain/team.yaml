team:
  name: dedication-chain
  description: A writer and editor complete a short dedication
  version: '0.1.0'
workspace:
  path: ../../workspace
  watch: false
workflow:
  entry_level: write
  invocation_modes: [user, team]
  user_facing: true
  input_contract:
    artifacts:
      - path: incoming-brief.md
        required: true
  output_contract:
    artifacts:
      - path: dedication.md
        required: true
    completion_artifact: dedication.md
agents:
  - name: dedication-writer
    type: agent
    role: Writer
    tools: []
    agent_file: ../../agents/dedication-writer/dedication-writer.md
  - name: editor
    type: agent
    role: Editor
    tools: []
    agent_file: ../../agents/editor/editor.md
    produces:
      - path: dedication.md
levels:
  - id: write
    name: Write
    order: 0
    stage:
      type: chain
      sequence: [dedication-writer, editor]
      config:
        handoff_format: markdown
        constraints:
          max_time_minutes: 4
          agent_timeout_minutes: 2
        output:
          format: dedication.md
          user_review: false
gates:
  - from: write
    to: done
    condition:
      type: artifact_exists
      artifact: dedication.md
