team:
  name: review-desk
  description: Chain that drafts, then asks a validator whether the work passes
  version: '0.1.0'

workspace:
  path: ../../workspace
  watch: false

workflow:
  entry_level: draft
  invocation_modes:
    - user
    - team
  user_facing: true
  input_contract:
    artifacts:
      - path: incoming-brief.md
        required: true
  output_contract:
    artifacts:
      - path: draft.md
        required: true
    completion_artifact: draft.md

agents:
  - name: writer
    type: agent
    role: Writes the draft
    tier: execution
    tools: []
    agent_file: ../../agents/writer/writer.md
    produces:
      - path: draft.md

  - name: reviewer
    type: agent
    role: Decides whether the draft passes
    tier: execution
    tools: []
    agent_file: ../../agents/reviewer/reviewer.md

levels:
  - id: draft
    name: Draft
    order: 0
    stage:
      type: chain
      sequence:
        - writer
      config:
        handoff_format: markdown
        constraints:
          max_time_minutes: 2
          agent_timeout_minutes: 1
          max_budget_usd: 1
        output:
          format: draft.md
          user_review: false

gates:
  - from: draft
    to: done
    condition:
      type: validation
      validator: reviewer
      strictness: hard
