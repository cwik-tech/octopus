crypto-investment-board:
  type: team
  description: "Investment-committee-style board for cryptocurrency investing across two styles: long-term thesis positions in established assets (BTC, ETH, majors) and a risk-budgeted speculative sleeve of early-stage tokens, DeFi, and narrative plays. The lead frames each question as an investment decision, convenes specialists, forces bull/bear tension, and produces a decision record with thesis, risks, and invalidation triggers. A discovery scout surfaces early-stage candidates from forums and social channels, which must pass diligence, risk, contrarian, and dated-fact verification before the portfolio strategist sizes them. Learning is a side benefit delivered through a shared plain-language explainer skill."
  team_path: "./teams/crypto-investment-board"
  input_artifact: "incoming-brief.md"
  output_artifact: "final-result.md"
  host_model: "gpt-5.4-mini"
  host_provider: "codex"
  tags:
    - "blockchain"
    - "crypto"
    - "defi"
    - "due-diligence"
    - "early-stage"
    - "investing"
    - "portfolio"
    - "regulation"

