# ─────────────────────────────────────────────────────────────────────────────
# Venture Capital Team
#
# Specialist venture-capital investment committee for startup deal screening,
# diligence pressure-testing, and investment memo synthesis.
# ─────────────────────────────────────────────────────────────────────────────

team:
  name: venture-capital-team
  description: >
    Venture-capital investment committee that classifies startup deals,
    orchestrates specialist diligence lenses, preserves a full board record,
    and returns a final investment memo with recommendation, tensions, and next
    diligence steps.
  version: "0.1.0"

workspace:
  path: ../../workspace
  watch: false

workflow:
  entry_level: deliberation
  capabilities:
    - venture-capital
    - startups
    - investing
    - deal-screening
    - due-diligence
    - investment-memo
  invocation_modes:
    - user
    - team
  user_facing: true
  input_contract:
    artifacts:
      - path: incoming-brief.md
        required: true
        description: Deal memo, pitch materials, diligence notes, or fund thesis for committee review.
  output_contract:
    artifacts:
      - path: output/minutes.md
        required: true
        description: Full meeting record with round-by-round agent responses and committee tensions.
      - path: output/investment-memo.md
        required: true
        description: Final venture investment memo with recommendation, tensions, risk register, and next actions.
    completion_artifact: output/investment-memo.md

agents:
  - name: vc-deal-evaluator
    type: agent
    role: >
      Classifies the deal, selects the committee, forces productive tension,
      preserves the board record, and synthesizes the final investment memo.
    tools:
      - set_roster
      - create_brief
      - converse
    agent_file: ../../agents/vc-deal-evaluator/vc-deal-evaluator.md
    experience_enabled: true
    color: 208
    produces:
      - path: output/minutes.md
      - path: output/investment-memo.md

  - name: vc-market-analyst
    type: agent
    role: Market size, competition, and domain dynamics.
    tools: []
    agent_file: ../../agents/vc-market-analyst/vc-market-analyst.md
    experience_enabled: true
    color: 39
    on_failure:
      policy: retry
      max_retries: 1

  - name: vc-contrarian-red-team
