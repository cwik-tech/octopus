levels:
  - id: deliberation
    name: Venture Capital Deliberation
    order: 0
    stage:
      type: discussion
      coordinator: vc-deal-evaluator
      participants:
        - vc-market-analyst
        - vc-contrarian-red-team
        - vc-founder-assessor
        - vc-financial-modeler
        - vc-deal-structurer
        - vc-technology-evaluator
        - vc-futurist-thesis-alignment
        - vc-portfolio-strategist
        - vc-pattern-matcher
        - vc-exit-strategist
        - vc-thesis-defounder
        - vc-traction-analyst
        - vc-legal-ip-due-diligence
        - vc-timing-deal-dynamics
        - vc-value-add-strategist
        - vc-wild-card
        - web-researcher
      on_agent_failure: skip
      config:
        mode: deliberate
        min_rounds: 1
        max_rounds: 2
        min_successful_participants: 3
        constraints:
          max_time_minutes: 4
          max_budget_usd: 18
        output:
          path: output
          format: minutes.md
          user_review: false

  - id: memo-synthesis
    name: Investment Memo Synthesis
    order: 1
    stage:
      type: chain
      sequence:
        - vc-deal-evaluator
      config:
        handoff_format: markdown
        constraints:
          max_time_minutes: 6
          agent_timeout_minutes: 3
          max_budget_usd: 8
        output:
          path: output
          format: investment-memo.md
          user_review: false

gates:
  - from: deliberation
    to: memo-synthesis
    condition:
      type: artifact_exists
      artifact: output/minutes.md

  - from: memo-synthesis
    to: done
    condition:
      type: artifact_exists
      artifact: output/investment-memo.md
